<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="970" viewBox="0 0 1000 970"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#284458"/></marker></defs><rect width="1000" height="970" fill="white"/><ellipse cx="350" cy="40" rx="55.0" ry="20.0" fill="#edf3f8" stroke="#284458" stroke-width="1.5"/><text x="350" y="45.0" text-anchor="middle" font-family="DejaVu Sans" font-size="15">Start</text><polygon points="185.0,85.0 535.0,85.0 515.0,135.0 165.0,135.0" fill="#edf3f8" stroke="#284458" stroke-width="1.5"/><text x="350" y="115.0" text-anchor="middle" font-family="DejaVu Sans" font-size="15">Load / validate data; build blocks</text><rect x="185.0" y="165.0" width="330" height="50" rx="2" fill="#edf3f8" stroke="#284458" stroke-width="1.5"/><text x="350" y="185.5" text-anchor="middle" font-family="DejaVu Sans" font-size="15">Fixed-time blocks first;</text><text x="350" y="204.5" text-anchor="middle" font-family="DejaVu Sans" font-size="15">then sorted flexible blocks</text><polygon points="350,250.0 470.0,280 350,310.0 230.0,280" fill="#edf3f8" stroke="#284458" stroke-width="1.5"/><text x="350" y="285.0" text-anchor="middle" font-family="DejaVu Sans" font-size="15">Next block?</text><rect x="160.0" y="335.0" width="380" height="50" rx="2" fill="#edf3f8" stroke="#284458" stroke-width="1.5"/><text x="350" y="355.5" text-anchor="middle" font-family="DejaVu Sans" font-size="15">Select block; create allowed intervals</text><text x="350" y="374.5" text-anchor="middle" font-family="DejaVu Sans" font-size="15">Fixed block: required time only</text><polygon points="350,420.0 470.0,450 350,480.0 230.0,450" fill="#edf3f8" stroke="#284458" stroke-width="1.5"/><text x="350" y="455.0" text-anchor="middle" font-family="DejaVu Sans" font-size="15">Next interval?</text><rect x="165.0" y="512.5" width="370" height="55" rx="2" fill="#edf3f8" stroke="#284458" stroke-width="1.5"/><text x="350" y="535.5" text-anchor="middle" font-family="DejaVu Sans" font-size="15">Take interval; filter allowed rooms</text><text x="350" y="554.5" text-anchor="middle" font-family="DejaVu Sans" font-size="15">Type, capacity, mandatory room</text><polygon points="350,600.0 470.0,630 350,660.0 230.0,630" fill="#edf3f8" stroke="#284458" stroke-width="1.5"/><text x="350" y="635.0" text-anchor="middle" font-family="DejaVu Sans" font-size="15">Next room?</text><rect x="165.0" y="692.5" width="370" height="55" rx="2" fill="#edf3f8" stroke="#284458" stroke-width="1.5"/><text x="350" y="715.5" text-anchor="middle" font-family="DejaVu Sans" font-size="15">Take room; check hard constraints</text><text x="350" y="734.5" text-anchor="middle" font-family="DejaVu Sans" font-size="15">and mandatory requests</text><polygon points="350,780.0 470.0,810 350,840.0 230.0,810" fill="#edf3f8" stroke="#284458" stroke-width="1.5"/><text x="350" y="815.0" text-anchor="middle" font-family="DejaVu Sans" font-size="15">Hard rules pass?</text><rect x="185.0" y="875.0" width="330" height="50" rx="2" fill="#edf3f8" stroke="#284458" stroke-width="1.5"/><text x="350" y="905.0" text-anchor="middle" font-family="DejaVu Sans" font-size="15">Assign; log soft warnings</text><polygon points="630.0,250.0 940.0,250.0 920.0,310.0 610.0,310.0" fill="#edf3f8" stroke="#284458" stroke-width="1.5"/><text x="775" y="275.5" text-anchor="middle" font-family="DejaVu Sans" font-size="15">Display schedules,</text><text x="775" y="294.5" text-anchor="middle" font-family="DejaVu Sans" font-size="15">failures and warnings</text><ellipse cx="775" cy="370" rx="55.0" ry="20.0" fill="#edf3f8" stroke="#284458" stroke-width="1.5"/><text x="775" y="375.0" text-anchor="middle" font-family="DejaVu Sans" font-size="15">End</text><rect x="610.0" y="417.5" width="330" height="65" rx="2" fill="#edf3f8" stroke="#284458" stroke-width="1.5"/><text x="775" y="445.5" text-anchor="middle" font-family="DejaVu Sans" font-size="15">Record unassigned block and</text><text x="775" y="464.5" text-anchor="middle" font-family="DejaVu Sans" font-size="15">NO ROOM / CONSTRAINT reason</text><polyline points="350,60 350,85" fill="none" stroke="#284458" stroke-width="1.7" marker-end="url(#a)"/><polyline points="350,135 350,165" fill="none" stroke="#284458" stroke-width="1.7" marker-end="url(#a)"/><polyline points="350,215 350,250" fill="none" stroke="#284458" stroke-width="1.7" marker-end="url(#a)"/><polyline points="350,310 350,335" fill="none" stroke="#284458" stroke-width="1.7" marker-end="url(#a)"/><text x="360" y="328" font-family="DejaVu Sans" font-size="14" fill="#173a59">Yes</text><polyline points="470,280 610,280" fill="none" stroke="#284458" stroke-width="1.7" marker-end="url(#a)"/><text x="530" y="270" font-family="DejaVu Sans" font-size="14" fill="#173a59">No</text><polyline points="775,310 775,350" fill="none" stroke="#284458" stroke-width="1.7" marker-end="url(#a)"/><polyline points="350,385 350,420" fill="none" stroke="#284458" stroke-width="1.7" marker-end="url(#a)"/><polyline points="350,480 350,512.5" fill="none" stroke="#284458" stroke-width="1.7" marker-end="url(#a)"/><text x="360" y="503" font-family="DejaVu Sans" font-size="14" fill="#173a59">Yes</text><polyline points="470,450 610,450" fill="none" stroke="#284458" stroke-width="1.7" marker-end="url(#a)"/><text x="530" y="440" font-family="DejaVu Sans" font-size="14" fill="#173a59">No</text><polyline points="350,567.5 350,600" fill="none" stroke="#284458" stroke-width="1.7" marker-end="url(#a)"/><polyline points="350,660 350,692.5" fill="none" stroke="#284458" stroke-width="1.7" marker-end="url(#a)"/><text x="360" y="683" font-family="DejaVu Sans" font-size="14" fill="#173a59">Yes</text><polyline points="230,630 90,630 90,450 230,450" fill="none" stroke="#284458" stroke-width="1.7" marker-end="url(#a)"/><text x="105" y="620" font-family="DejaVu Sans" font-size="14" fill="#173a59">No</text><polyline points="350,747.5 350,780" fill="none" stroke="#284458" stroke-width="1.